<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> flex box - align self</title>

    <style>
        *{  
            margin: 0px;
            padding: 0px;
        }
    body{   
        background-color:rgb(114, 113, 113) ;
    } 
        div.conteine{   
            background-color: darkgray;
            height: 400px;
            flex-flow: row wrap;
            align-items: flex-start;
            display: flex;
            
        }  

        div.item{   
            background-color: brown;
            padding: 20px;
            border: 1px solid white;
            
            text-align: center;
           
            
        } 
        
        div#i1{ 
           align-self: center;
        }

        div#i2{ 
            align-self: stretch;
        }
        div#i3{ 
           align-self: flex-end;
        }
        div#i4{ 
          align-self: stretch;  
        }
        div#i5{ 
           align-self: auto;
        }
        div#i6{ 
           align-self: center;     
        }
        div#i7{ 
          align-self: stretch;  
        }
    </style>

</head> 
<body>
    
    
    <div class="conteine">  

        <div class="item" id="i1"> A</div>
        <div class="item" id="i2"> B</div>
        <div class="item" id="i3"> C</div>
        <div class="item" id="i4"> D</div>
        <div class="item" id="i5"> E</div>
        <div class="item" id="i6"> F</div>
        <div class="item" id="i7"> G</div>

    </div>
</body>
</html>
