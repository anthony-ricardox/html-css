<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>

    <style>
        *{  
            margin: 0px;
            padding: 0px;
        }
    body{   
        background-color:black ;
    } 
        div.conteine{   
            background-color: darkgray;
            display:flex;
            flex-flow: row wrap-reverse;
            
        }  

        div.item{   
            background-color: brown;
            border: 1px solid white;
            padding: 5px;
            text-align: center;
            flex: auto;
            
            
        }   
    </style>

</head> 
<body>
    
    
    <div class="conteine">  

        <div class="item">Exemplo de blocos A</div>
        <div class="item">Exemplo de blocos B</div>
        <div class="item">Exemplo de blocos C</div>
        <div class="item">Exemplo de blocos D</div>
        <div class="item">Exemplo de blocos E</div>
        <div class="item">Exemplo de blocos F</div>
        <div class="item">Exemplo de blocos G</div>

    </div>
</body>
</html>
