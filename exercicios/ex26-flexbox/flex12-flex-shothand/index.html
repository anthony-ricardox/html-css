<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>

    <style>
        
    body{   
        background-color:rgb(114, 113, 113) ;
    } 
        div.conteine{   
            background-color: darkgray;
            display: flex;
            flex-flow: row nowrap;
            
            
        }  

        div.item{   
            background-color: brown;
            padding: 5px;
            border: 1px solid white;
            text-align: center;
            
            
            
        } 
        
        #a{ 
           /*flex-shrink: 1;
           flex-grow: 0; 
           flex-basis: 200px;*/

           flex:  0 1 200px;
        }
        #b{ 
          /*flex-shrink: 0;
          flex-grow: 1;
          flex-basis: 150px;*/
          flex: 1 1 150px;
        }
        #c{ 
         /* flex-shrink: 1;
          flex-grow: 0;  
          flex-basis: auto;*/
          flex: 1 8 auto;
        }
    </style>

</head> 
<body>
    
    
    <div class="conteine">  

        <div class="item" id="a"> A </div>
        <div class="item" id="b"> B </div>
        <div class="item" id="c"> C </div>
  
    </div>
</body>
</html>
