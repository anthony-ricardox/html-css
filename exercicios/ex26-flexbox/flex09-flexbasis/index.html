<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>

    <style>
        *{  
            margin: 0px;
            padding: 0px;
        }
    body{   
        background-color:rgb(114, 113, 113) ;
    } 
        div.conteine{   
            background-color: darkgray;
           
            display: flex;
            flex-flow: row wrap;

        }  

        div.item{   
            background-color: brown;
            padding: 5px;
            border: 1px solid white;
            text-align: center;
            flex-basis: 150px;
            
        }  
        #a{
            flex-basis: 200px;
        } 
    </style>

</head> 
<body>
    
    
    <div class="conteine">  

        <div class="item" id="a"> A</div>
        <div class="item"> Conteudo menor</div>
        <div class="item"> C</div>
        <div class="item"> COnteutdo maior</div>
        <div class="item"> E</div>
        <div class="item"> Conteudo maior e vai ocupar o maior espaço</div>
        <div class="item"> G</div>

    </div>
</body>
</html>
