<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
        <h1>Formulario</h1>

        <form action="cadrastro.php" method="post">   
            <p> 
                <label for="iest">Estado:</label>

                <select name="estado" id="iestado"> 
                    <option value="" selected>Escolha</option>
                    <optgroup label="Regiao Sudeste">

                        <option value="MG">Minas Gerais</option>
                        <option value="SP">São paulo</option>
                        <option value="RJ">Rio De Janeiro</option>
                    </optgroup>

                    <optgroup label="Regiao Nordeste">
                        <option value="CE">Ceára</option>
                        <option value="PE">Pernamuco</option>
                        <option value="PB">Paraiba</option>
                    </optgroup>

                </select>
            </p>

            <p> 
                <label for="iprof">Profisão:</label>
                <input type="text" name="prof" id="iprof" list="lstprof">

                <datalist id="lstprof">  

                    <option > Desenvolvedor </option>
                    <option >Professor</option>
                    <option >Administrador</option>
                    <option > Advogado</option>
                </datalist>
            </p>

            <p> 
                <label for="imsg">Mensagem </label> <br>
                <textarea name="msg" id="imsg" cols="30"></textarea>
            </p>

            <p> 
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>

</body>
</html>
