<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulario  </title>
</head>
<body>
    <h1> Teste de formulario - email e telefone </h1>

    <form action="cadrastro.php" method="get" autocomplete="on">   
        <fieldset>
                <legend>Dados Pessoais</legend>
                <p> 
                    <label for="iname">Nome:</label>
                    <input type="text" name="name" id="iname" required autocomplete="username" minlength="8" maxlength="20" placeholder="Digite seu nome">
                </p>

                <p>
                    <label for="iemail">Email:</label>
                    <input type="email" name="email" id="iemail" required autocomplete="email" placeholder="Digite seu email">
                </p>
                <p>
                    <label for="itel">Telefone:</label>
                    <input type="tel" name="tel" id="itel" required placeholder="(xx) xxxx-xxxx" autocomplete="tel" pattern="^(\d{2}\d)\d{4:5}-\d{4} $">
                    <!-- Estudar mais sobre expressoes regulares = RegEx-->
                </p>
                <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>
            
            
        </fieldset>



    </form>
</body>
</html>
